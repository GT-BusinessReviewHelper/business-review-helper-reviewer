<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <rect width="128" height="128" rx="28" fill="#FFFFFF"/>
  <!-- BRH QR Pyramid Icon -->
  <g fill="#05031C" transform="translate(14, 14) scale(0.78)">
    <!-- Top Apex -->
    <rect x="58" y="10" width="12" height="12" rx="2"/>
    
    <!-- Row 2 -->
    <rect x="50" y="26" width="10" height="10" rx="2"/>
    <rect x="68" y="26" width="10" height="10" rx="2"/>
    
    <!-- Row 3 QR Finder Marks -->
    <rect x="42" y="40" width="10" height="10" rx="2"/>
    <rect x="58" y="40" width="12" height="12" rx="2"/>
    <rect x="76" y="40" width="10" height="10" rx="2"/>
    
    <!-- Row 4 -->
    <rect x="34" y="56" width="10" height="10" rx="2"/>
    <rect x="50" y="56" width="10" height="10" rx="2"/>
    <rect x="68" y="56" width="10" height="10" rx="2"/>
    <rect x="84" y="56" width="10" height="10" rx="2"/>

    <!-- Base Pyramid QR Blocks -->
    <rect x="22" y="72" width="12" height="12" rx="2.5"/>
    <rect x="40" y="72" width="10" height="10" rx="2"/>
    <rect x="56" y="72" width="16" height="16" rx="3" fill="#3157FF"/>
    <rect x="78" y="72" width="10" height="10" rx="2"/>
    <rect x="94" y="72" width="12" height="12" rx="2.5"/>
    
    <rect x="14" y="90" width="10" height="10" rx="2"/>
    <rect x="30" y="90" width="10" height="10" rx="2"/>
    <rect x="46" y="90" width="10" height="10" rx="2"/>
    <rect x="72" y="90" width="10" height="10" rx="2"/>
    <rect x="88" y="90" width="10" height="10" rx="2"/>
    <rect x="104" y="90" width="10" height="10" rx="2"/>

    <!-- Bottom corners -->
    <rect x="6" y="106" width="12" height="12" rx="2.5"/>
    <rect x="24" y="106" width="10" height="10" rx="2"/>
    <rect x="40" y="106" width="10" height="10" rx="2"/>
    <rect x="58" y="106" width="12" height="12" rx="2"/>
    <rect x="78" y="106" width="10" height="10" rx="2"/>
    <rect x="94" y="106" width="10" height="10" rx="2"/>
    <rect x="110" y="106" width="12" height="12" rx="2.5"/>
